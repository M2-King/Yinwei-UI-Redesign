<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>音围 · Spatial Player</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --elevated: #2C2C2E;
      --hairline: rgba(255,255,255,0.1);
      --accent: #0A84FF;
      --text: #F5F5F7;
      --muted: #8E8E93;
      --success: #30D158;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      min-height: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: calc(12px + var(--safe-t)) 16px calc(20px + var(--safe-b));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .nav {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .nav h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
    .nav .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .nav .open {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, #2a2a2c 0%, #1c1c1e 100%);
      color: var(--accent);
      display: grid; place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 12px rgba(0,0,0,0.35);
    }
    .nav .open svg { width: 18px; height: 18px; }
    .nav .open:active { transform: scale(0.94); }
    .viz-wrap {
      display: flex; justify-content: center; padding: 4px 0 8px;
    }
    #orbit { width: min(72vw, 280px); aspect-ratio: 1; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
    }
    .np {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: center;
    }
    .art {
      width: 64px; height: 64px; border-radius: 10px;
      background: linear-gradient(145deg, #3a4550, #1a1a1c);
      display: grid; place-items: center; color: var(--muted); font-size: 22px;
    }
    .np-title { font-size: 16px; font-weight: 600; }
    .np-artist { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .scrub { margin-top: 12px; }
    .scrub input { width: 100%; }
    .times {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted); margin-top: 4px;
    }
    .transport {
      display: flex; justify-content: center; align-items: center; gap: 18px;
      margin-top: 14px;
    }
    .ctrl {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, #2c2c2e 0%, #1a1a1c 100%);
      color: #fff;
      display: grid; place-items: center;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 6px 16px rgba(0,0,0,0.4);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .ctrl svg { width: 20px; height: 20px; display: block; }
    .ctrl:active {
      transform: scale(0.92);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.45);
    }
    .ctrl.play {
      width: 64px; height: 64px;
      background: linear-gradient(180deg, #3a3a3e 0%, #232326 55%, #1a1a1c 100%);
      border-color: rgba(255,255,255,0.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 0 0 1px rgba(10,132,255,0.15),
        0 10px 28px rgba(0,0,0,0.5),
        0 0 24px rgba(10,132,255,0.18);
    }
    .ctrl.play svg { width: 26px; height: 26px; }
    .ctrl.play.is-playing {
      background: linear-gradient(180deg, #1a6fd6 0%, #0A84FF 55%, #0660c0 100%);
      border-color: rgba(255,255,255,0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 10px 28px rgba(10,132,255,0.35),
        0 0 28px rgba(10,132,255,0.35);
    }
    .seg {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(44,44,46,0.92);
      border-radius: 14px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.45);
      isolation: isolate;
    }
    .seg::before {
      content: "";
      position: absolute;
      top: 4px; bottom: 4px; left: 4px;
      width: calc(50% - 4px);
      border-radius: 11px;
      background: linear-gradient(180deg, #2f8fff 0%, #0A84FF 55%, #0770db 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 4px 12px rgba(10,132,255,0.35);
      transition: transform .22s cubic-bezier(.2,.8,.2,1);
      z-index: 0;
    }
    .seg[data-active="right"]::before { transform: translateX(100%); }
    .seg button {
      position: relative; z-index: 1;
      border: 0; background: transparent;
      color: rgba(255,255,255,0.45);
      font-size: 14px; font-weight: 600;
      padding: 12px 8px; border-radius: 11px;
      transition: color .18s ease;
    }
    .seg button.active { color: #fff; }
    .seg button:active { transform: scale(0.98); }
    .section-label {
      font-size: 15px; font-weight: 600; margin: 4px 0 8px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .chip {
      border: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, #2c2c2e 0%, #222224 100%);
      color: var(--muted);
      border-radius: 12px; min-height: 44px; font-size: 12px; font-weight: 500;
      padding: 8px 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform .1s ease, background .15s ease, color .15s ease;
    }
    .chip:active { transform: scale(0.96); }
    .chip.active {
      background: linear-gradient(180deg, #2f8fff 0%, #0A84FF 60%, #066fd0 100%);
      color: #fff;
      border-color: rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 12px rgba(10,132,255,0.3);
    }
    .sliders { display: flex; flex-direction: column; gap: 6px; }
    .row {
      display: flex; justify-content: space-between; font-size: 13px; color: var(--muted);
    }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
      background: rgba(255,255,255,0.12); border-radius: 2px; outline: none; margin: 10px 0 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 0 4px rgba(10,132,255,0.2);
    }
    .status {
      text-align: center; font-size: 11px; color: var(--muted);
      display: flex; justify-content: center; align-items: center; gap: 6px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    .export {
      width: 100%; height: 50px; border: 0; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
    }
    .save {
      width: 100%; border: 0; background: transparent; color: var(--accent);
      font-size: 15px; font-weight: 500; padding: 8px; margin-bottom: 4px;
    }
    .toast {
      position: fixed; left: 50%; bottom: calc(28px + var(--safe-b));
      transform: translateX(-50%); background: var(--card); border: 1px solid var(--hairline);
      padding: 10px 14px; border-radius: 12px; font-size: 13px; opacity: 0;
      transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (min-width: 860px) {
      body { background: #111; }
      .app {
        max-width: 390px; margin: 24px auto;
        border: 1px solid var(--hairline); border-radius: 28px;
        min-height: calc(100vh - 48px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="nav">
      <div>
        <h1>音围</h1>
        <div class="sub">Spatial Player</div>
      </div>
      <button class="open" id="openBtn" type="button" aria-label="Open file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/></svg>
      </button>
    </header>

    <div class="viz-wrap">
      <canvas id="orbit" width="560" height="560"></canvas>
    </div>

    <section class="card">
      <div class="np">
        <div class="art">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5Z" fill="currentColor" stroke="none"/></svg>
        </div>
        <div>
          <div class="np-title">Across the Room</div>
          <div class="np-artist">ODESZA</div>
        </div>
      </div>
      <div class="scrub">
        <input id="seek" type="range" min="0" max="231" value="102" />
        <div class="times"><span id="t0">01:42</span><span>03:51</span></div>
      </div>
      <div class="transport">
        <button type="button" class="ctrl" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2.2v12H6V6Zm3.2 6 8.8 5.4V6.6L9.2 12Z"/></svg>
        </button>
        <button type="button" class="ctrl play is-playing" id="play" aria-label="Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6.5h2.8v11H8v-11Zm5.2 0H16v11h-2.8v-11Z"/></svg>
        </button>
        <button type="button" class="ctrl" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.8 6H18v12h-2.2V6ZM6 17.4 14.8 12 6 6.6v10.8Z"/></svg>
        </button>
      </div>
    </section>

    <div class="seg" id="ab" data-active="right">
      <button type="button" data-mode="original" data-side="left">Original</button>
      <button type="button" class="active" data-mode="spatial" data-side="right">Spatial</button>
    </div>

    <div>
      <div class="section-label">Position</div>
      <div class="grid" id="presets"></div>
    </div>

    <div class="sliders">
      <div>
        <div class="row"><span>Azimuth</span><strong id="azVal">110°</strong></div>
        <input id="azimuth" type="range" min="-180" max="180" value="110" />
      </div>
      <div>
        <div class="row"><span>Elevation</span><strong id="elVal">-10°</strong></div>
        <input id="elevation" type="range" min="-90" max="90" value="-10" />
      </div>
      <div>
        <div class="row"><span>Distance</span><strong id="distVal">2.10 m</strong></div>
        <input id="distance" type="range" min="5" max="100" value="21" />
      </div>
    </div>

    <div class="seg" id="motion" data-active="left">
      <button type="button" class="active" data-motion="fixed" data-side="left">Fixed</button>
      <button type="button" data-motion="orbit" data-side="right">Orbit</button>
    </div>

    <div class="sliders">
      <div>
        <div class="row"><span>Orbit Speed</span><strong id="hzVal">0.40 Hz</strong></div>
        <input id="orbitHz" type="range" min="0" max="200" value="40" />
      </div>
      <div>
        <div class="row"><span>Envelopment</span><strong id="envVal">60%</strong></div>
        <input id="envelopment" type="range" min="0" max="100" value="60" />
      </div>
      <div>
        <div class="row"><span>Reverb</span><strong id="revVal">20%</strong></div>
        <input id="reverb" type="range" min="0" max="100" value="20" />
      </div>
    </div>

    <div class="status"><span class="dot"></span> Offline · Local file · Headphones recommended</div>
    <button class="export" id="exportBtn" type="button">Export WAV</button>
    <button class="save" id="presetBtn" type="button">Save Preset</button>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const PRESETS = [
      { id: 'front', label: 'Front', az: 0, el: 0, d: 1.5 },
      { id: 'leftFront', label: 'Left Front', az: -45, el: 0, d: 1.5 },
      { id: 'rightFront', label: 'Right Front', az: 45, el: 0, d: 1.5 },
      { id: 'left', label: 'Left', az: -90, el: 0, d: 1.5 },
      { id: 'right', label: 'Right', az: 90, el: 0, d: 1.5 },
      { id: 'leftRear', label: 'Left Rear', az: -135, el: 0, d: 1.5 },
      { id: 'rightRear', label: 'Right Rear', az: 135, el: 0, d: 1.5 },
      { id: 'back', label: 'Back', az: 180, el: 0, d: 1.5 },
      { id: 'overhead', label: 'Overhead', az: 0, el: 75, d: 1.5 },
    ];

    const state = {
      playing: true, mode: 'spatial', motion: 'fixed',
      azimuth: 110, elevation: -10, distance: 2.1,
      orbitHz: 0.4, envelopment: 0.6, reverb: 0.2,
      preset: 'right', start: performance.now(),
    };

    const presetsEl = document.getElementById('presets');
    PRESETS.forEach((p) => {
      const b = document.createElement('button');
      b.className = 'chip' + (p.id === state.preset ? ' active' : '');
      b.textContent = p.label;
      b.dataset.id = p.id;
      b.onclick = () => {
        state.preset = p.id; state.azimuth = p.az; state.elevation = p.el; state.distance = p.d;
        syncInputs(); renderPresets();
      };
      presetsEl.appendChild(b);
    });

    function renderPresets() {
      [...presetsEl.children].forEach((el) => el.classList.toggle('active', el.dataset.id === state.preset));
    }

    function updateLabels() {
      azVal.textContent = `${Math.round(state.azimuth)}°`;
      elVal.textContent = `${Math.round(state.elevation)}°`;
      distVal.textContent = `${state.distance.toFixed(2)} m`;
      hzVal.textContent = `${state.orbitHz.toFixed(2)} Hz`;
      envVal.textContent = `${Math.round(state.envelopment * 100)}%`;
      revVal.textContent = `${Math.round(state.reverb * 100)}%`;
    }

    function syncInputs() {
      azimuth.value = state.azimuth; elevation.value = state.elevation;
      distance.value = Math.round(state.distance * 10);
      orbitHz.value = Math.round(state.orbitHz * 100);
      envelopment.value = Math.round(state.envelopment * 100);
      reverb.value = Math.round(state.reverb * 100);
      updateLabels();
    }

    azimuth.oninput = (e) => { state.azimuth = +e.target.value; state.preset = null; renderPresets(); updateLabels(); };
    elevation.oninput = (e) => { state.elevation = +e.target.value; state.preset = null; renderPresets(); updateLabels(); };
    distance.oninput = (e) => { state.distance = +e.target.value / 10; state.preset = null; renderPresets(); updateLabels(); };
    orbitHz.oninput = (e) => { state.orbitHz = +e.target.value / 100; updateLabels(); };
    envelopment.oninput = (e) => { state.envelopment = +e.target.value / 100; updateLabels(); };
    reverb.oninput = (e) => { state.reverb = +e.target.value / 100; updateLabels(); };

    const ICON_PAUSE = '<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6.5h2.8v11H8v-11Zm5.2 0H16v11h-2.8v-11Z"/></svg>';
    const ICON_PLAY = '<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6.8v10.4L17.2 12 9 6.8Z"/></svg>';

    play.onclick = () => {
      state.playing = !state.playing;
      play.classList.toggle('is-playing', state.playing);
      play.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
      play.innerHTML = state.playing ? ICON_PAUSE : ICON_PLAY;
    };

    function wireSeg(root, onPick) {
      root.querySelectorAll('button').forEach((btn) => {
        btn.onclick = () => {
          root.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          root.dataset.active = btn.dataset.side;
          onPick(btn);
        };
      });
    }

    wireSeg(document.getElementById('ab'), (btn) => { state.mode = btn.dataset.mode; });
    wireSeg(document.getElementById('motion'), (btn) => { state.motion = btn.dataset.motion; });

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
    exportBtn.onclick = () => toast('Export WAV — 引擎尚未接线（UI 预览）');
    presetBtn.onclick = () => toast('Save Preset — 下一迭代');
    openBtn.onclick = () => toast('Open local file — Flutter/原生下一迭代');

    seek.oninput = (e) => {
      const s = +e.target.value;
      t0.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    };

    const canvas = document.getElementById('orbit');
    const ctx = canvas.getContext('2d');

    function visualAzimuth() {
      if (state.motion === 'orbit' && state.playing && state.mode === 'spatial') {
        const t = (performance.now() - state.start) / 1000;
        let az = state.azimuth + t * state.orbitHz * 360;
        return ((az + 180) % 360 + 360) % 360 - 180;
      }
      return state.azimuth;
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      const c = { x: w/2, y: h/2 }, r = Math.min(w,h) * 0.38;
      ctx.clearRect(0,0,w,h);
      ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.stroke();

      const az = visualAzimuth();
      const rad = (az - 90) * Math.PI / 180;
      const active = state.playing && state.mode === 'spatial';
      ctx.beginPath(); ctx.arc(c.x,c.y,r,rad-1.1,rad);
      ctx.strokeStyle = active ? 'rgba(10,132,255,0.6)' : 'rgba(10,132,255,0.25)';
      ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();

      const x = c.x + r * Math.cos(rad), y = c.y + r * Math.sin(rad);
      ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2);
      ctx.fillStyle = 'rgba(10,132,255,0.28)'; ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2);
      ctx.fillStyle = '#0A84FF'; ctx.fill();
      requestAnimationFrame(draw);
    }

    syncInputs(); draw();
  </script>
</body>
</html>
