<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音围 · Spatial Player Preview</title>
  <style>
    :root {
      --bg: #0B0B0D;
      --panel: #141416;
      --elevated: #1C1C1E;
      --hairline: rgba(255,255,255,0.08);
      --accent: #0A84FF;
      --text: #F5F5F7;
      --muted: #8E8E93;
      --success: #30D158;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .window {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      border-bottom: 1px solid var(--hairline);
    }
    .titlebar h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.4px; }
    .titlebar p { font-size: 11px; color: var(--muted); }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 300px;
      min-height: 0;
    }
    .viz {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #orbit {
      width: min(420px, 90%);
      aspect-ratio: 1;
    }
    .now {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 10px;
    }
    .cover {
      width: 220px;
      height: 220px;
      border-radius: 14px;
      background:
        linear-gradient(145deg, #2a2a2e, #121214),
        radial-gradient(circle at 30% 30%, #3a4a5a, transparent 60%);
      border: 1px solid var(--hairline);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 48px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .track-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .track-artist { font-size: 13px; color: var(--muted); }
    .track-album { font-size: 11px; color: var(--muted); }
    .scrubber {
      width: min(320px, 100%);
      margin-top: 16px;
    }
    .scrubber input[type=range] { width: 100%; }
    .times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .transport {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }
    .transport button {
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }
    .transport .play {
      width: 56px;
      height: 56px;
      background: var(--elevated);
      font-size: 22px;
    }
    .seg {
      display: inline-flex;
      background: var(--elevated);
      border-radius: 9px;
      padding: 3px;
      margin-top: 14px;
      gap: 2px;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
    }
    .seg button.active {
      background: var(--accent);
      color: #fff;
    }
    .sidebar {
      background: var(--panel);
      border-left: 1px solid var(--hairline);
      padding: 20px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
    }
    .label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .chip {
      background: var(--elevated);
      border: 0;
      color: var(--muted);
      border-radius: 10px;
      padding: 12px 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .chip.active { background: var(--accent); color: #fff; }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
    .row strong { color: var(--muted); font-weight: 500; }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: var(--hairline);
      border-radius: 2px;
      outline: none;
      margin: 10px 0 4px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(10,132,255,0.15);
    }
    .actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }
    .btn {
      height: 44px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 0;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--hairline);
    }
    .status {
      height: 36px;
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      font-size: 11px;
      color: var(--muted);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }
    .toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--elevated);
      border: 1px solid var(--hairline);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    .banner {
      background: rgba(10,132,255,0.12);
      color: #9ec5ff;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      border-bottom: 1px solid var(--hairline);
    }
    @media (max-width: 980px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { border-left: 0; border-top: 1px solid var(--hairline); }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="banner">Web UI preview · DSP/export 尚未接线 · Offline mock</div>
    <header class="titlebar">
      <h1>音围</h1>
      <p>Spatial Player</p>
    </header>

    <div class="main">
      <section class="viz">
        <canvas id="orbit" width="500" height="500"></canvas>
      </section>

      <section class="now">
        <div class="cover" id="cover">♪</div>
        <div class="track-title">Across the Room</div>
        <div class="track-artist">ODESZA</div>
        <div class="track-album">A Moment Apart</div>

        <div class="scrubber">
          <input id="seek" type="range" min="0" max="231" value="102" />
          <div class="times"><span id="t0">01:42</span><span>03:51</span></div>
        </div>

        <div class="transport">
          <button type="button" aria-label="prev">⏮</button>
          <button type="button" class="play" id="play" aria-label="play">⏸</button>
          <button type="button" aria-label="next">⏭</button>
        </div>

        <div class="seg" id="ab">
          <button type="button" data-mode="original">Original</button>
          <button type="button" class="active" data-mode="spatial">Spatial</button>
        </div>
      </section>

      <aside class="sidebar">
        <div class="label">Position</div>
        <div class="grid" id="presets"></div>

        <div>
          <div class="row"><span>Azimuth</span><strong id="azVal">90°</strong></div>
          <input id="azimuth" type="range" min="-180" max="180" value="90" />
        </div>
        <div>
          <div class="row"><span>Elevation</span><strong id="elVal">-10°</strong></div>
          <input id="elevation" type="range" min="-90" max="90" value="-10" />
        </div>
        <div>
          <div class="row"><span>Distance</span><strong id="distVal">2.10 m</strong></div>
          <input id="distance" type="range" min="5" max="100" value="21" />
        </div>

        <div class="seg" id="motion" style="width:100%; justify-content:stretch;">
          <button type="button" class="active" data-motion="fixed" style="flex:1">Fixed Position</button>
          <button type="button" data-motion="orbit" style="flex:1">Orbit</button>
        </div>

        <div>
          <div class="row"><span>Orbit Speed</span><strong id="hzVal">0.40 Hz</strong></div>
          <input id="orbitHz" type="range" min="0" max="200" value="40" />
        </div>
        <div>
          <div class="row"><span>Envelopment</span><strong id="envVal">60%</strong></div>
          <input id="envelopment" type="range" min="0" max="100" value="60" />
        </div>
        <div>
          <div class="row"><span>Reverb</span><strong id="revVal">20%</strong></div>
          <input id="reverb" type="range" min="0" max="100" value="20" />
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="exportBtn" type="button">Export WAV</button>
          <button class="btn btn-ghost" id="presetBtn" type="button">Save Preset</button>
        </div>
      </aside>
    </div>

    <footer class="status">
      <span class="dot"></span>
      <span>Offline</span><span>·</span>
      <span>Local file</span><span>·</span>
      <span>Headphones recommended</span>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const PRESETS = [
      { id: 'front', label: 'Front', az: 0, el: 0, d: 1.5 },
      { id: 'leftFront', label: 'Left Front', az: -45, el: 0, d: 1.5 },
      { id: 'rightFront', label: 'Right Front', az: 45, el: 0, d: 1.5 },
      { id: 'left', label: 'Left', az: -90, el: 0, d: 1.5 },
      { id: 'right', label: 'Right', az: 90, el: 0, d: 1.5 },
      { id: 'leftRear', label: 'Left Rear', az: -135, el: 0, d: 1.5 },
      { id: 'rightRear', label: 'Right Rear', az: 135, el: 0, d: 1.5 },
      { id: 'back', label: 'Back', az: 180, el: 0, d: 1.5 },
      { id: 'overhead', label: 'Overhead', az: 0, el: 75, d: 1.5 },
    ];

    const state = {
      playing: true,
      mode: 'spatial',
      motion: 'fixed',
      azimuth: 90,
      elevation: -10,
      distance: 2.1,
      orbitHz: 0.4,
      envelopment: 0.6,
      reverb: 0.2,
      preset: 'right',
      start: performance.now(),
    };

    const presetsEl = document.getElementById('presets');
    PRESETS.forEach((p) => {
      const b = document.createElement('button');
      b.className = 'chip' + (p.id === state.preset ? ' active' : '');
      b.textContent = p.label;
      b.dataset.id = p.id;
      b.onclick = () => {
        state.preset = p.id;
        state.azimuth = p.az;
        state.elevation = p.el;
        state.distance = p.d;
        syncInputs();
        renderPresets();
      };
      presetsEl.appendChild(b);
    });

    function renderPresets() {
      [...presetsEl.children].forEach((el) => {
        el.classList.toggle('active', el.dataset.id === state.preset);
      });
    }

    function syncInputs() {
      document.getElementById('azimuth').value = state.azimuth;
      document.getElementById('elevation').value = state.elevation;
      document.getElementById('distance').value = Math.round(state.distance * 10);
      document.getElementById('orbitHz').value = Math.round(state.orbitHz * 100);
      document.getElementById('envelopment').value = Math.round(state.envelopment * 100);
      document.getElementById('reverb').value = Math.round(state.reverb * 100);
      updateLabels();
    }

    function updateLabels() {
      document.getElementById('azVal').textContent = `${Math.round(state.azimuth)}°`;
      document.getElementById('elVal').textContent = `${Math.round(state.elevation)}°`;
      document.getElementById('distVal').textContent = `${state.distance.toFixed(2)} m`;
      document.getElementById('hzVal').textContent = `${state.orbitHz.toFixed(2)} Hz`;
      document.getElementById('envVal').textContent = `${Math.round(state.envelopment * 100)}%`;
      document.getElementById('revVal').textContent = `${Math.round(state.reverb * 100)}%`;
    }

    document.getElementById('azimuth').oninput = (e) => {
      state.azimuth = +e.target.value; state.preset = null; renderPresets(); updateLabels();
    };
    document.getElementById('elevation').oninput = (e) => {
      state.elevation = +e.target.value; state.preset = null; renderPresets(); updateLabels();
    };
    document.getElementById('distance').oninput = (e) => {
      state.distance = +e.target.value / 10; state.preset = null; renderPresets(); updateLabels();
    };
    document.getElementById('orbitHz').oninput = (e) => {
      state.orbitHz = +e.target.value / 100; updateLabels();
    };
    document.getElementById('envelopment').oninput = (e) => {
      state.envelopment = +e.target.value / 100; updateLabels();
    };
    document.getElementById('reverb').oninput = (e) => {
      state.reverb = +e.target.value / 100; updateLabels();
    };

    document.getElementById('play').onclick = () => {
      state.playing = !state.playing;
      document.getElementById('play').textContent = state.playing ? '⏸' : '▶';
    };

    document.querySelectorAll('#ab button').forEach((btn) => {
      btn.onclick = () => {
        state.mode = btn.dataset.mode;
        document.querySelectorAll('#ab button').forEach((b) => b.classList.toggle('active', b === btn));
      };
    });

    document.querySelectorAll('#motion button').forEach((btn) => {
      btn.onclick = () => {
        state.motion = btn.dataset.motion;
        document.querySelectorAll('#motion button').forEach((b) => b.classList.toggle('active', b === btn));
      };
    });

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
    document.getElementById('exportBtn').onclick = () => toast('Export WAV — spatial_core 尚未接线（预览 UI）');
    document.getElementById('presetBtn').onclick = () => toast('Save Preset — 本地 JSON 下一迭代');

    document.getElementById('seek').oninput = (e) => {
      const s = +e.target.value;
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      document.getElementById('t0').textContent = `${m}:${sec}`;
    };

    const canvas = document.getElementById('orbit');
    const ctx = canvas.getContext('2d');

    function visualAzimuth() {
      if (state.motion === 'orbit' && state.playing && state.mode === 'spatial') {
        const t = (performance.now() - state.start) / 1000;
        let az = state.azimuth + t * state.orbitHz * 360;
        az = ((az + 180) % 360 + 360) % 360 - 180;
        return az;
      }
      return state.azimuth;
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      const c = { x: w / 2, y: h / 2 };
      const r = Math.min(w, h) * 0.38;
      ctx.clearRect(0, 0, w, h);

      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const az = visualAzimuth();
      const rad = (az - 90) * Math.PI / 180;
      const active = state.playing && state.mode === 'spatial';

      ctx.beginPath();
      ctx.arc(c.x, c.y, r, rad - 1.1, rad);
      ctx.strokeStyle = active ? 'rgba(10,132,255,0.55)' : 'rgba(10,132,255,0.2)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();

      const x = c.x + r * Math.cos(rad);
      const y = c.y + r * Math.sin(rad);
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(10,132,255,0.25)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#0A84FF';
      ctx.fill();

      requestAnimationFrame(draw);
    }

    syncInputs();
    draw();
  </script>
</body>
</html>
