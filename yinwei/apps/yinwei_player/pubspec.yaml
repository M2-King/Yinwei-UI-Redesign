name: yinwei_player
description: 音围 Spatial Player — local HRTF spatial audio player
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  file_picker: ^10.3.10
  desktop_drop: ^0.8.4
  path_provider: ^2.1.4
  provider: ^6.1.2
  ffi: ^2.1.3
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  webview_flutter: ^4.14.1
  webview_flutter_windows: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/spatial_workspace/
    - assets/spatial_workspace/vendor/
