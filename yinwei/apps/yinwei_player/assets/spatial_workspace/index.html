<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>音围 Spatial Workspace</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0B0B0D;
      font-family: "SF Pro Text", "Segoe UI", "Helvetica Neue", sans-serif;
      color: #F5F5F7;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #views {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 10px;
      background: rgba(18, 18, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.09);
      pointer-events: auto;
    }
    #views button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #8E8E93;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    #views button.on {
      background: rgba(10, 132, 255, 0.32);
      color: #fff;
    }
    #pose {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(18, 18, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: 11px;
      letter-spacing: 0.02em;
      color: #F5F5F7;
    }
    #pose span { color: #8E8E93; margin-right: 4px; }
    #sel {
      position: absolute;
      left: 12px;
      bottom: 36px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(18, 18, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: 11px;
      line-height: 1.45;
      display: none;
      min-width: 168px;
    }
    #sel .ch {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    #sel .muted { color: #8E8E93; }
    #hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      text-align: center;
      font-size: 10px;
      color: rgba(142, 142, 147, 0.85);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="views">
      <button data-view="free" class="on">Free</button>
      <button data-view="top">Top</button>
      <button data-view="front">Front</button>
      <button data-view="listener">Listener</button>
    </div>
    <div id="pose"><span>Az</span>— <span>El</span>— <span>Dist</span>—</div>
    <div id="sel"></div>
    <div id="hint">拖动音源改 HRTF · 拖动音箱仅布局 · 右键平移 · 滚轮缩放</div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="scene.js"></script>
</body>
</html>
