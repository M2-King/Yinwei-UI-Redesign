# Unsigned device build. No signing secrets, certificates or profiles.
name: Yinwei iOS Unsigned IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - yinwei-ui-redesign

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  COPYFILE_DISABLE: "1"

jobs:
  build_unsigned_ipa:
    name: Test and build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PLAYER: ${{ github.workspace }}/yinwei/apps/yinwei_player
      YINWEI_ROOT: ${{ github.workspace }}/yinwei
      LOG_DIR: ${{ github.workspace }}/.ci-ios-logs
      IPA_PATH: ${{ github.workspace }}/Yinwei-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report macOS and Xcode
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun swift --version
            echo "Git SHA: $GITHUB_SHA"
          } | tee "$LOG_DIR/environment.txt"

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Listen Room page tests
        working-directory: yinwei/apps/yinwei_player
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/listen_room/room_math_test.mjs test/listen_room/bridge_test.mjs \
            test/listen_room/offline_contract_test.mjs 2>&1 | tee "$LOG_DIR/listen-room-node-tests.log"

      - name: Swift capture tests including unsorted five-group profile
        run: |
          set -euo pipefail
          bash "$YINWEI_ROOT/tools/test_ios_capture.sh" 2>&1 | tee "$LOG_DIR/swift-capture-tests.log"

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: yinwei

      - name: Flutter dependencies
        working-directory: yinwei/apps/yinwei_player
        run: flutter pub get

      - name: Flutter regression tests
        working-directory: yinwei/apps/yinwei_player
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$LOG_DIR/flutter-test.log"

      - name: Rust audio regression tests
        working-directory: yinwei
        run: |
          set -euo pipefail
          cargo test --locked -p spatial_core 2>&1 | tee "$LOG_DIR/cargo-test.log"

      - name: Build native iOS audio library
        run: |
          set -euo pipefail
          bash "$YINWEI_ROOT/tools/build_native_ios.sh" device 2>&1 | tee "$LOG_DIR/native-build.log"

      - name: Generate iOS plugin integration
        working-directory: yinwei/apps/yinwei_player
        run: |
          set -euo pipefail
          python3 "$YINWEI_ROOT/tools/patch_ios_file_picker_no_dkcamera.py" "$PLAYER"
          flutter build ios --config-only --release --no-codesign \
            --build-number="$GITHUB_RUN_NUMBER" --dart-define=YINWEI_IOS_BUILD="$GITHUB_RUN_NUMBER"
          python3 "$YINWEI_ROOT/tools/patch_ios_file_picker_no_dkcamera.py" "$PLAYER/ios"
          if [[ -f ios/Podfile ]]; then
            (cd ios && pod install)
          fi

      - name: Build Flutter release iOS app without signing
        working-directory: yinwei/apps/yinwei_player
        run: |
          set -euo pipefail
          # The run number makes each IPA a newer build for the iPad update check.
          flutter build ios --release --no-codesign \
            --build-number="$GITHUB_RUN_NUMBER" --dart-define=YINWEI_IOS_BUILD="$GITHUB_RUN_NUMBER" \
            2>&1 | tee "$LOG_DIR/flutter-build-ios.log"

      - name: Verify device binaries and native audio linkage
        run: |
          set -euo pipefail
          APP="$PLAYER/build/ios/iphoneos/Runner.app"
          EXT="$APP/PlugIns/YinweiBroadcastUpload.appex"
          test -f "$APP/Runner"
          test -f "$EXT/YinweiBroadcastUpload"
          file "$APP/Runner" "$EXT/YinweiBroadcastUpload"
          xcrun vtool -show-build "$APP/Runner"
          xcrun vtool -show-build "$EXT/YinweiBroadcastUpload"
          bash "$YINWEI_ROOT/tools/verify_ios_ffi.sh" "$APP/Runner" | tee "$LOG_DIR/ffi-verification.log"

      - name: Package complete Runner.app into unsigned IPA
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d "$RUNNER_TEMP/yinwei-ipa.XXXXXX")"
          mkdir -p "$STAGING/Payload"
          cp -R "$PLAYER/build/ios/iphoneos/Runner.app" "$STAGING/Payload/Runner.app"
          (cd "$STAGING" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          python3 "$YINWEI_ROOT/tools/verify_unsigned_ipa.py" "$IPA_PATH" \
            --report "$GITHUB_WORKSPACE/Yinwei-ipa-verification.json"

      - name: Write build report
        run: |
          set -euo pipefail
          {
            echo "Yinwei unsigned device IPA — sign before installation"
            echo "Commit: $GITHUB_SHA"
            echo "iPad build: $GITHUB_RUN_NUMBER (update channel version <app version>-dev.$GITHUB_RUN_NUMBER)"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Runner: macos-latest ($(uname -m))"
            xcodebuild -version
            flutter --version
            rustc --version
            echo 'Build command: flutter build ios --release --no-codesign --build-number=<run> --dart-define=YINWEI_IOS_BUILD=<run>'
            cat "$LOG_DIR/swift-capture-tests.log"
            grep -E '^# (tests|pass|fail)' "$LOG_DIR/listen-room-node-tests.log"
            grep 'test result:' "$LOG_DIR/cargo-test.log"
            tail -n 3 "$LOG_DIR/flutter-test.log"
            cat "$GITHUB_WORKSPACE/Yinwei-ipa-verification.json"
          } | tee "$GITHUB_WORKSPACE/Yinwei-build-info.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yinwei-iOS-unsigned-${{ github.sha }}
          path: |
            Yinwei-unsigned.ipa
            Yinwei-build-info.txt
            Yinwei-ipa-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yinwei-iOS-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-ios-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
